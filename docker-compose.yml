services:
  app:
    build:
      context: .
      target: runtime
    volumes:
      - ./dados:/dados
    # uso: docker compose run --rm app livros

  test:
    build:
      context: .
      target: base
    volumes:
      - ./tests:/app/tests:ro
      - ./bibliolivre:/app/bibliolivre:ro
    entrypoint: ["python", "-m", "unittest", "discover", "-s", "tests", "-t", ".", "-v"]
    # uso: docker compose run --rm test
