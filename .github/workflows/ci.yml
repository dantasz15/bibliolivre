name: CI

on:
  push:
    branches: [main, devevop, "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar ferramenta de lint
        run: python -m pip install --upgrade pip ruff
      - name: Verificar código e testes
        run: ruff check bibliolivre tests

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar pacote e dependências de desenvolvimento
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Executar suíte com cobertura
        run: coverage run --source=bibliolivre --omit='bibliolivre/__main__.py' -m unittest discover -s tests -t . -v
      - name: Exigir cobertura mínima de 95%
        run: coverage report --show-missing --fail-under=95
      - name: Exportar cobertura
        if: always()
        run: |
          coverage report --show-missing > coverage-summary.txt || true
          coverage xml -o coverage.xml || true
      - name: Publicar artefatos de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: |
            coverage-summary.txt
            coverage.xml
          if-no-files-found: warn
          retention-days: 30

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validar harness no container
        run: docker compose run --build --rm test
      - name: Validar imagem de execução
        run: docker build --target runtime --tag bibliolivre:ci .
