[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bibliolivre"
version = "1.0.0"
description = "Sistema de empréstimos para bibliotecas comunitárias"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.6,<8",
    "ruff>=0.8,<1",
]

[project.scripts]
bibliolivre = "bibliolivre.cli:main"

[tool.setuptools.packages.find]
include = ["bibliolivre*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF"]

[tool.coverage.run]
source = ["bibliolivre"]
omit = ["bibliolivre/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
